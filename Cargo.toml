[package]
name = "indica"
version = "0.2.0"
edition = "2024"
description = "Fast technical analysis indicators for Indian stock markets — 16 indicators, signal engine, batch screening, streaming API"
license = "MIT"
repository = "https://github.com/Devansh-365/indica"
homepage = "https://github.com/Devansh-365/indica"
documentation = "https://docs.rs/indica"
readme = "README.md"
keywords = ["trading", "technical-analysis", "indicators", "finance", "stocks"]
categories = ["finance", "mathematics"]
authors = ["Devansh Tiwari"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
rayon = "1.11"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1

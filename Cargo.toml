[package]
name = "indica"
version = "0.1.0"
edition = "2024"
description = "Fast technical analysis indicators for stock markets"
license = "MIT"
repository = "https://github.com/Devansh-365/indica"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
napi = { version = "3", features = ["napi4"] }
napi-derive = "3"
rayon = "1.11"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
codegen-units = 1
